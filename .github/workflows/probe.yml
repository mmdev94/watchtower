# Watchtower's probe. Every 5 minutes (when GitHub's scheduler gets to it) it
# checks each listed ms.computer site once, and commits what it saw to the
# `data` branch. Each run's results are signed (Sigstore, via GitHub
# attestations), so anyone can confirm a file came from this workflow and was
# not edited afterwards:
#
#   gh attestation verify latest.json -R mmdev94/watchtower
#
# The log of every run lists every check, as measured.
name: Probe
run-name: Check every site

on:
  schedule:
    # minutes 3, 8, 13…: off the top of the hour, when GitHub's scheduler is busiest
    - cron: '3-58/5 * * * *'
  # also right away when the probe or the site list changes
  push:
    branches: [main]
    paths:
      - config/**
      - scripts/probe.ts
      - scripts/alerts.ts
      - src/lib/feed.ts
      - src/lib/model.ts
      - src/lib/badge.ts
      - .github/workflows/probe.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Open the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach out FETCH_HEAD
          else
            git worktree add --orphan -b data out
          fi

      - name: Check every site
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/probe.ts --out out

      - name: Send alerts (comments on each site's alert issue)
        # an alert problem must never stop the data being saved
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/alerts.ts --out out

      - name: Sign this run's results
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/latest.json
            out/summary.json

      - name: Save to the data branch
        working-directory: out
        run: |
          git add -A
          git commit -q -m "Checks at $(jq -r .at latest.json)" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for i in 1 2 3; do
            git push -q origin HEAD:refs/heads/data && exit 0
            echo "Push refused (attempt $i); taking the newer data branch and trying again."
            git fetch --depth=1 origin data
            git rebase -q FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1

  # GitHub's scheduler is "best effort": it skips runs, sometimes for hours.
  # So every run — whatever started it — makes sure the next one exists: five
  # minutes after it began, if no newer run has started or is waiting, it
  # starts one. The schedule above stays as a backup that restarts the chain
  # if a run ever fails to.
  keep-going:
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start the next check in 5 minutes, unless one is already coming
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.probe.outputs.started }}
        run: |
          set -euo pipefail
          START=${STARTED:-$(date +%s)}
          WAIT=$(( START + 300 - $(date +%s) ))
          [ "$WAIT" -le 0 ] || sleep "$WAIT"
          # runs of this workflow created after this one started, or still waiting to start
          NEWER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/probe.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(((.created_at | fromdateiso8601) > $START) or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\")] | length")
          if [ "$NEWER" -gt 0 ]; then
            echo "The next check is already on its way ($NEWER newer run). Nothing to do."
            exit 0
          fi
          gh workflow run probe.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Started the next check."
