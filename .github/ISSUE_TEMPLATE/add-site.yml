name: Add my site
description: Ask Watchtower to watch an ms.computer site
title: "[Add] "
labels: [add-site]
body:
  - type: input
    id: url
    attributes:
      label: Address
      description: The site's ms.computer address
      placeholder: https://my-site-a1234.ms.computer
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name to show
      placeholder: My Site
  - type: input
    id: repo
    attributes:
      label: GitHub repo (optional)
      placeholder: owner/repo
